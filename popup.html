<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KelvaniDownloader</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="setup-help.css"><script type="module" src="popup.js"></script></head><body><header><img src="logo.svg" width="32" height="32" alt=""><h1>Kelvani<span>Downloader</span></h1><button id="settings-toggle" class="gear-button" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button></header><main><section id="settings-panel" hidden><h2>Einstellungen</h2><label>Sprache<select data-language-picker><option value="en" data-language>English</option><option value="de" data-language>Deutsch</option></select></label><label>Downloadordner</label><p id="directory-path">Standard: Downloads</p><button id="choose-directory">Ordner w&#228;hlen</button><button id="reset-directory" class="kd-cancel">Standard wiederherstellen</button><p id="directory-status" role="status"></p><button id="settings-back" class="kd-cancel">Zur&#252;ck</button></section><form id="url-form"><label for="video-url">YouTube-URL</label><div class="url-row"><input id="video-url" type="text" inputmode="url" placeholder="YouTube-Link einf&#252;gen" required autocomplete="off"><button type="submit" id="check-url">Pr&#252;fen</button></div></form><p id="title">Öffne ein YouTube Video.</p><label>Format<select id="format"><option value="mp4">Video · MP4</option><option value="mp3">Audio · MP3</option><option value="wav">Audio · WAV</option></select></label><label id="quality-label">Auflösung<select id="quality"></select></label><button id="download" disabled>Herunterladen ↓</button><p id="status" role="status"></p></main></body></html>
