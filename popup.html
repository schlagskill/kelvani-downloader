<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KelvaniDownloader</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="setup-help.css"><script type="module" src="popup.js"></script></head><body><header><img src="logo.svg" width="32" height="32" alt=""><h1>Kelvani<span>Downloader</span></h1></header><main><form id="url-form"><label for="video-url">YouTube-URL</label><div class="url-row"><input id="video-url" type="text" inputmode="url" placeholder="YouTube-Link einf&#252;gen" required autocomplete="off"><button type="submit" id="check-url">Pr&#252;fen</button></div></form><p id="title">Öffne ein YouTube Video.</p><label>Format<select id="format"><option value="mp4">Video · MP4</option><option value="mp3">Audio · MP3</option><option value="wav">Audio · WAV</option></select></label><label id="quality-label">Auflösung<select id="quality"></select></label><button id="download" disabled>Herunterladen ↓</button><p id="status" role="status"></p></main></body></html>
